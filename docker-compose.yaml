services:
  mysql:
    image: mysql:latest
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
    healthcheck:
      # TCP, not the socket: during first-boot initialization a temporary
      # server listens on the socket only, so the check must keep failing
      # until the real server accepts connections. $$ escapes compose
      # interpolation; the container shell expands $MYSQL_ROOT_PASSWORD.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  redis:
    image: redis:alpine
    ports: ["6379:6379"]
    volumes:
      - ./testdata/dump.redis:/data/init-data.redis
    command: >
      sh -c "redis-server --save '' --appendonly no &
             sleep 2 &&
             redis-cli < /data/init-data.redis &&
             tail -f /dev/null"

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./testdata/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_PASSWORD: alpha
    healthcheck:
      # /ping needs no auth; wget ships with the image, curl does not
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  grpc-server:
    build: ./scripts/grpc
    ports: ["50051:50051"]

  mcp-server:
    build: ./scripts/mcp
    ports: ["3001:3001"]
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "3001"

  # services for openapi testing
  petstore-api:
    image: swaggerapi/petstore3:latest
    ports:
      - "8091:8080"
    environment:
      SWAGGER_HOST: "http://localhost:8091"
      SWAGGER_BASE_PATH: "/api/v3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v3/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8092:8080"
    environment:
      URLS_PRIMARY_NAME: "PetStore API"
      CONFIG_URL: "http://localhost:8091/api/v3/openapi.json"
    depends_on:
      petstore-api:
        condition: service_healthy
