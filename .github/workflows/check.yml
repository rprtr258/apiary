name: Check pull request

on:
  push:
    branches: ["*"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Run typecheck
        run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Run ESLint
        run: bun run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Run unit tests
        run: bun run test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Start integration services
        # Same services the tests use locally (see README); --wait blocks until
        # healthchecked services are ready and the rest are running.
        run: docker compose up -d --wait postgres redis grpc-server

      - name: Wait for gRPC server
        # grpc-server has no compose healthcheck, so poll its port before testing.
        run: timeout 60 bash -c 'until (exec 3<>/dev/tcp/localhost/50051) 2>/dev/null; do sleep 1; done'

      - name: Run integration tests
        run: bun run test:integration

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  e2e-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install deps
        run: bun install

      - name: Install Electron binary
        # Electron 42 no longer ships a postinstall, so the binary is not
        # fetched at install time; playwright then downloads it lazily per
        # worker on the first electron.launch, and parallel launches race on
        # the same dist/electron file ("spawn ETXTBSY"). install.js is a
        # no-op when the binary is already present.
        run: node node_modules/electron/install.js

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libatspi2.0-0 libgtk-3-0 libnotify4 \
            libxss1 libxtst6 libxi6

      - name: Rebuild native modules for Electron ABI
        # e2e tests launch the app and load better-sqlite3 from inside Electron,
        # which needs the Electron NODE_MODULE_VERSION, not bun's (see sql-source-table.spec.ts:8).
        run: bun run kal

      - name: Run E2E tests
        env:
          CI: "1"
        run: bun run test:e2e

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 1
