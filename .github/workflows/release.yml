name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # v0.0.0, v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: true
        default: '0.0.0-test'

jobs:
  tag-on-master:
    name: Tag is on master
    # Gate for the whole pipeline: releases are cut from master only.
    # Runs (and no-ops) on workflow_dispatch - a skipped job in `needs` would skip all dependents.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history so origin/master is available for the ancestry check

      - name: Verify tag commit is on master
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/master || {
            echo "::error::${GITHUB_REF_NAME} does not point to a commit on master"
            exit 1
          }

  build-linux:
    name: Build Linux
    needs: [tag-on-master]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for release notes

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Go for wasm engine
        uses: actions/setup-go@v6
        with:
          go-version-file: internal/redissql/wasm/go.mod
          cache-dependency-path: internal/redissql/wasm/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build Vite (renderer + Electron main process)
        run: bun run build

      - name: Package Electron app for Linux
        run: bunx electron-builder --linux --config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        run: ls -la release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: apiary-linux-amd64
          if-no-files-found: "error"
          path: release/apiary-linux-*

  build-macos:
    name: Build macOS
    needs: [tag-on-master]
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go for wasm engine
        uses: actions/setup-go@v6
        with:
          go-version-file: internal/redissql/wasm/go.mod
          cache-dependency-path: internal/redissql/wasm/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build Vite (renderer + Electron main process)
        run: bun run build

      - name: Package Electron app for macOS (${{ matrix.arch }})
        run: bunx electron-builder --mac --${{ matrix.arch }} --config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        run: ls -la release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: apiary-darwin-${{ matrix.arch }}
          if-no-files-found: "error"
          path: release/apiary-darwin-${{ matrix.arch }}.*

  build-windows:
    name: Build Windows
    needs: [tag-on-master]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "version=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = "${{ github.ref }}"
            $version = $tag -replace 'refs/tags/v', ''
            echo "version=$version" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Go for wasm engine
        uses: actions/setup-go@v6
        with:
          go-version-file: internal/redissql/wasm/go.mod
          cache-dependency-path: internal/redissql/wasm/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build Vite (renderer + Electron main process)
        run: bun run build

      - name: Package Electron app for Windows
        run: bunx electron-builder --win --config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem -Path release/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: apiary-win-x64
          if-no-files-found: "error"
          path: release/apiary-win-*

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Check artifact existence
        id: check-artifacts
        run: |
          echo "Checking for required artifacts..."

          # Check for Linux artifact
          LINUX_ARTIFACT=$(find artifacts/apiary-linux-amd64 -type f 2>/dev/null | head -1)
          if [[ -n "$LINUX_ARTIFACT" ]]; then
            echo "Linux artifact found: $LINUX_ARTIFACT"
            LINUX_FOUND=true
          else
            echo "Linux artifact NOT found"
            LINUX_FOUND=false
          fi

          # Check for macOS artifacts
          MAC_X64_ARTIFACT=$(find artifacts/apiary-darwin-x64 -type f 2>/dev/null | head -1)
          MAC_ARM64_ARTIFACT=$(find artifacts/apiary-darwin-arm64 -type f 2>/dev/null | head -1)
          if [[ -n "$MAC_X64_ARTIFACT" ]] && [[ -n "$MAC_ARM64_ARTIFACT" ]]; then
            echo "macOS artifacts found"
            MACOS_FOUND=true
          else
            echo "macOS artifacts NOT found"
            MACOS_FOUND=false
          fi

          # Check for Windows artifact
          WIN_ARTIFACT=$(find artifacts/apiary-win-x64 -type f 2>/dev/null | head -1)
          if [[ -f "$WIN_ARTIFACT" ]]; then
            echo "Windows artifact found"
            WINDOWS_FOUND=true
          else
            echo "Windows artifact NOT found"
            WINDOWS_FOUND=false
          fi
          export WINDOWS_FOUND # TODO: unused

          # Require at least Linux and macOS artifacts
          if [[ "$LINUX_FOUND" == "true" ]] && [[ "$MACOS_FOUND" == "true" ]]; then
            echo "Required artifacts present"
            echo "artifacts_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Missing required artifacts"
            find artifacts -type f 2>/dev/null || true
            echo "artifacts_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: List artifacts
        if: steps.check-artifacts.outputs.artifacts_ok == 'true'
        run: find artifacts -type f

      - name: Extract version for release
        if: steps.check-artifacts.outputs.artifacts_ok == 'true'
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # TODO: remove *.blockmap and *.yml THAT ARE FUCKING PUBLISHED FOR SOME FUCKING REASON FUCK YOU GITHUB
      - name: Create Release
        if: steps.check-artifacts.outputs.artifacts_ok == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          working_directory: artifacts
          files: |
            **/apiary-*.AppImage
            **/apiary-*.dmg
            **/apiary-*.exe
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-test') || contains(steps.version.outputs.version, '-rc') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: [release]
    # workflow_dispatch test builds publish no tag; never push the tap for them.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read  # GITHUB_TOKEN only reads own repo's release assets

    steps:
      - name: Checkout apiary (cask template)
        uses: actions/checkout@v7

      - name: Download released artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo rprtr258/apiary --pattern "apiary-darwin-*.dmg" --pattern "apiary-linux-*.AppImage"

      - name: Compute sha256s
        id: sha
        run: |
          {
            echo "dmg_arm64=$(sha256sum apiary-darwin-arm64.dmg | cut -d' ' -f1)"
            echo "dmg_x64=$(sha256sum apiary-darwin-x64.dmg | cut -d' ' -f1)"
            echo "appimage_x86_64=$(sha256sum apiary-linux-x86_64.AppImage | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Render cask from template
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA_DMG_ARM64@/${{ steps.sha.outputs.dmg_arm64 }}/g" \
              -e "s/@SHA_DMG_X64@/${{ steps.sha.outputs.dmg_x64 }}/g" \
              -e "s/@SHA_APPIMAGE_X86_64@/${{ steps.sha.outputs.appimage_x86_64 }}/g" \
              homebrew/apiary.rb > rendered-apiary.rb
          # A leftover placeholder means the template drifted from this job; fail loudly.
          ! grep -q "@[A-Z_]*@" rendered-apiary.rb || { echo "unrendered placeholder left in cask"; exit 1; }
          cat rendered-apiary.rb

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: rprtr258/homebrew-tap
          # GITHUB_TOKEN cannot push to another repo; HOMEBREW_TAP_TOKEN is a PAT
          # with Contents: read+write on rprtr258/homebrew-tap only.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # The tap is synced wholesale: full cask written over the old one, legacy
      # formula removed, so the tap state is fully defined by this repo.
      - name: Sync tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Casks
          cp rendered-apiary.rb tap/Casks/apiary.rb
          rm -f tap/Formula/apiary.rb
          cd tap
          git add -A
          if git diff --cached --quiet; then
            echo "Tap already up to date for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "apiary ${VERSION#v}"
          git push
