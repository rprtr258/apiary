<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>apiary</title>
  <link rel="stylesheet" href="/node_modules/github-markdown-css/github-markdown.css" />
  <style>
    * {
      padding: 0;
      margin: 0;
      color-scheme: dark;
    }
    body {
      height: 100vh;
      width: 100vw;
    }
    .h100 {
      height: 100%;
    }
    #layoutContainer {
      background: transparent;
    }

    /* Design tokens (dark theme). */
    :root {
      --bg: #101318;
      --bg2: #0b0e12;
      --pane: #14171c;
      --ink: #e7eaf0;
      --faint: #8b93a1;
      --hair: #262b36;
      --accent: #93c5fd;
      --accent-ink: #101318;
      --ok: #5eead4;
      --warn: #fcd34d;
      --err: #f87171;
      --result: #5eead4;
      --sel: #1e3a5f;
      --green: #22c55e;
      --type: #c4b5fd;
      /* apiary extension: text on saturated fills (schema canvas nodes) */
      --on-fill: #ffffff;
    }

    html, body, #app {
      font: 13px/1.45 "Inter", "Helvetica Neue", system-ui, sans-serif;
      /* background: rgb(10, 10, 20); */
      /* color: white; */
      height: 100%;
      max-height: 100%;
      margin: 0;
      --row-even: var(--bg2);
      --row-odd: var(--bg);
      --row-highlight: var(--sel);
      --col-highlight: var(--sel);
    }

    table {
      table-layout: fixed;
      /* border-spacing: 0;
      width: 100%;
      column-width: 50%;
      text-align: left; */
    }
    th:hover {
      background-color: var(--col-highlight) !important; /* NOTE: in order to override inline styles */
    }
    table tr:nth-child(odd) {
      background-color: var(--row-odd);
    }
    table tr:nth-child(even) {
      background-color: var(--row-even);
    }
    td:hover {
      background-color: var(--row-highlight);
    }

    textarea {
      height: 100%;
    }

    .highlight-red {
      color: var(--faint);
    }
    .highlight-red:hover {
      color: var(--err);
    }

    /* that fucking shit does not set that by default and does not give element to me to
       change style so dealing with that in such way */
    .cm-editor {
      height: 100%;
    }

    /* Thin quiet scrollbars on the token palette. Webkit pseudo rules only:
       setting standard scrollbar-width/scrollbar-color anywhere makes Chromium
       ignore these. */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track,
    ::-webkit-scrollbar-corner {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--hair);
      border: 4px solid transparent;
      border-radius: 6px;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--faint);
    }
  </style>
  <style id="dynamic-styles" type="text/css"></style>
</head>
<body>
</body>
<script type="module" src="./renderer/renderer.ts"></script>
</html>
